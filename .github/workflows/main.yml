name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps
        working-directory: agenda-voz-clean

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Inicializar proyecto EAS
        run: eas init --force --non-interactive
        working-directory: agenda-voz-clean
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Compilar APK local
        run: eas build -p android --profile preview --non-interactive --local --output ${{ github.workspace }}/agenda-voz.apk
        working-directory: agenda-voz-clean
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-voz-apk
          path: agenda-voz.apk
          retention-days: 30
