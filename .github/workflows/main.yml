name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agenda-voz-clean

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Compilar APK con EAS
        run: eas build -p android --profile preview --non-interactive --output ../agenda-voz.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-voz-apk
          path: "*.apk"
          retention-days: 30
```

---

### Opción B — Más limpia: mover los archivos a la raíz

En GitHub, los archivos deberían estar así:
```
/ (raíz del repo)
├── App.js
├── package.json
├── app.json
├── eas.json
...
```

En vez de:
```
/agenda-voz-clean/App.js
/agenda-voz-clean/package.json
...
